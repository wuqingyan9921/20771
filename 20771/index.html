<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Your Eyes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one fixed screen. #stage holds the scene layers (cables.gl house, line-art graveyard, shadow figure, fog);
   #world adds eyelids, black-outs and game text and can shake as a whole. The old-film layer, the white flash and the loader sit above. */
:root{
  --ink:#0b0a09;        /* projector black, faintly warm */
  --bone:#eee8da;       /* silver-print white */
  --ash:#9a9385;
  --flash:#fffdf7;
  --dawn:#f3e6cf;       /* the real world, warm and in colour */
  --dawn-ink:#3a2c1e;
  --f-goth:"UnifrakturMaguntia","Old English Text MT","Goudy Text MT",serif;
  --f-fell:"IM Fell English","Iowan Old Style",Georgia,serif;
  --f-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;
  font-family:var(--f-fell);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- world / stage ---------- */
#world{position:fixed;inset:0;z-index:1;will-change:transform}
#stage{position:absolute;inset:0;z-index:1;overflow:hidden;transform-origin:50% 50%;will-change:transform;background:#000}
#vViscera{position:absolute;top:0;left:-300vw;width:100%;height:100%;border:0;pointer-events:none;background:var(--ink);z-index:1;opacity:0}
#vViscera.here{left:0}
/* the cables.gl scene is rendered larger than the screen so the "camera" can pan across it */
#bgWrap{position:absolute;inset:0;z-index:2;transform-origin:40% 58%;will-change:transform,opacity}
#vHouse{position:absolute;left:-12vw;top:-8vh;width:124vw;height:116vh;border:0;pointer-events:none;background:#000;transform-origin:0 0;image-rendering:pixelated}
#yard,#fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#yard{z-index:3;image-rendering:pixelated}
#fog{z-index:5}
#eyes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;image-rendering:pixelated}
/* inside: eyes grown into the walls, drawn over the Sketchfab scene */
#wallEyes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
/* a warped still of the guts, and the things drawn into the room: carving, photo, roots */
#warp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#worldFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
/* the photo you wake up next to */
#keepsake{position:absolute;z-index:3;top:9vh;right:7vw;width:min(34vw,12rem);height:auto;opacity:0;transform:translateY(-24px) rotate(11deg);
  transition:opacity 1.8s ease,transform 1.8s cubic-bezier(.2,.8,.2,1);box-shadow:0 14px 36px rgba(60,40,20,.45)}
#keepsake.in{opacity:1;transform:rotate(7deg)}


/* the real world: morning light through blinds */
#real{position:absolute;inset:0;z-index:2;overflow:hidden;filter:blur(14px);transition:filter 4.5s ease;
  background:radial-gradient(ellipse 80% 70% at 72% 28%, #fff8ea 0%, var(--dawn) 42%, #d9bf9a 78%, #b89a74 100%)}
#real.focus{filter:blur(0)}
#real::before{content:"";position:absolute;right:-8%;top:-12%;width:70%;height:95%;transform:rotate(-14deg) skewX(-10deg);filter:blur(5px);opacity:.75;
  background:repeating-linear-gradient(180deg, rgba(255,252,240,.95) 0 26px, rgba(255,252,240,0) 26px 44px);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);mask-image:linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent)}
#real::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(90,60,30,.35) 100%)}


#lids{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.lid{position:absolute;left:-15%;width:130%;height:62%;background:#000;filter:blur(22px)}
.lid.top{top:0;border-radius:0 0 50% 50% / 0 0 38% 38%;transform:translateY(-110%)}
.lid.bottom{bottom:0;border-radius:50% 50% 0 0 / 38% 38% 0 0;transform:translateY(110%)}

#black{position:absolute;inset:-6%;z-index:7;background:#000;opacity:0;pointer-events:none}

/* ---------- old film layer ---------- */
#grain,#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 3s ease}
#grain{z-index:10;opacity:.07}
#dust{z-index:11;opacity:.5}
#vignette{position:fixed;inset:0;z-index:12;pointer-events:none;transition:opacity 3s ease;
  background:radial-gradient(ellipse 75% 70% at 50% 48%, transparent 52%, rgba(0,0,0,.55) 82%, rgba(0,0,0,.9) 100%)}
#gate{position:fixed;inset:1.1vmin;z-index:13;pointer-events:none;border-radius:2.6vmin;transition:opacity 3s ease;
  box-shadow:0 0 0 4vmin #050404, inset 0 0 5vmin 1vmin rgba(0,0,0,.85)}
#flicker{position:fixed;inset:0;z-index:14;pointer-events:none;background:#000;opacity:0}
body.real #grain,body.real #dust,body.real #vignette,body.real #gate{opacity:0}

/* ---------- game text ---------- */
#ui{position:absolute;inset:0;z-index:8;pointer-events:none;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#ui section{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#title{justify-content:center;gap:1.6rem;text-align:center;
  background:radial-gradient(ellipse 62% 36% at 50% 50%, rgba(0,0,0,.72), rgba(0,0,0,.35) 60%, transparent 100%)}
#title::before{content:"";position:absolute;left:50%;top:50%;width:min(80vw,62rem);height:min(30vw,16rem);transform:translate(-50%,-58%);
  border-radius:50%;background:radial-gradient(ellipse at center, rgba(255,246,222,.22), rgba(255,240,210,.07) 45%, transparent 70%);
  filter:blur(18px);opacity:0;transition:opacity 2.5s ease 1.4s;pointer-events:none}
#title.ready::before{opacity:1;animation:halo 3.6s ease-in-out 3.8s infinite alternate}
@keyframes halo{from{opacity:.65;transform:translate(-50%,-58%) scale(.96)}to{opacity:1;transform:translate(-50%,-58%) scale(1.05)}}
#wake{position:relative;pointer-events:auto;cursor:pointer;background:none;border:0;padding:.1em .3em;
  font-family:var(--f-goth);font-weight:400;font-size:clamp(3.2rem,11vw,9.5rem);line-height:1;color:#fffbf1;letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 0 .04em #fff,0 0 .12em rgba(255,250,232,.95),0 0 .3em rgba(255,240,208,.65),0 0 .7em rgba(255,232,192,.42),0 0 1.5em rgba(255,226,180,.26)}
#wake.dip{opacity:.62}
#wake .ch{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.12em)}
#wake.in .ch{animation:inkIn 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes inkIn{to{opacity:1;filter:blur(0);transform:none}}
#wake:hover,#wake:focus-visible{color:#fff}
#wake:focus-visible{outline:1px solid rgba(238,232,218,.6);outline-offset:.25em}
#wake.leaving .ch{animation:inkOut .7s ease-in forwards !important}
@keyframes inkOut{from{opacity:1}to{opacity:0;filter:blur(14px);transform:translateY(-.15em) scale(1.25)}}
.hint{margin:0;font-family:var(--f-sc);font-size:clamp(.8rem,1.8vw,1rem);letter-spacing:.32em;color:var(--bone);text-shadow:0 1px 6px #000;
  opacity:0;transition:opacity 2s ease 2s}
#title.ready .hint{opacity:.62}
#title.gone .hint{opacity:0;transition:opacity .4s}

#dialog{justify-content:flex-end;gap:clamp(1.4rem,4vh,2.4rem);padding-bottom:max(9vh,calc(env(safe-area-inset-bottom,0px) + 4.5rem));
  background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 30%, transparent 55%);transition:opacity .9s ease}
#dialog.dim{opacity:0}
#dialog.center{justify-content:center;padding-bottom:0;background:none}
#dialog.light{background:none}
#line{margin:0;min-height:1.2em;max-width:min(92vw,58rem);font-family:var(--f-fell);font-style:italic;font-size:clamp(2rem,6.4vw,4.2rem);
  line-height:1.15;text-align:center;color:var(--bone);text-shadow:0 .06em .5em rgba(0,0,0,.9);text-wrap:balance;transition:opacity .8s ease}
#line.out{opacity:0}
#line .ch{display:inline-block;white-space:pre;animation:tremble .16s steps(2,end) infinite}
#line.shout{font-size:clamp(1.9rem,6vw,4rem);font-style:normal;letter-spacing:.01em;text-shadow:0 0 .3em rgba(0,0,0,.95),0 .06em .5em #000}
#line.shout .ch{animation-duration:.08s}
#line.voice{font-family:var(--f-goth);font-style:normal;font-size:clamp(2.2rem,7vw,5rem);line-height:1.1;color:#fffbf1;
  text-shadow:0 0 .1em rgba(255,250,232,.85),0 0 .4em rgba(255,236,200,.45),0 0 1.1em rgba(255,226,180,.25)}
#line.thought{font-size:clamp(1.5rem,4.4vw,2.8rem);color:#d8d1c2}
#line.thought .ch,#line.real .ch{animation:none}
#line.real{font-size:clamp(1.5rem,4.6vw,2.8rem);color:var(--dawn-ink);text-shadow:none}
#line.inner{font-size:clamp(1.4rem,4vw,2.4rem);color:#d8d1c2}
#line.inner .ch{animation:none}
/* a clue held up close: the headstone or the door plate */
#inspect{justify-content:center;padding-top:5vh;padding-bottom:24vh;opacity:0;transition:opacity .9s ease;
  background:radial-gradient(ellipse 70% 60% at 50% 42%, rgba(0,0,0,.6), rgba(0,0,0,.9))}
#inspect.show{opacity:1}
#inspect svg{width:min(88vw,30rem);height:auto;max-height:60vh;display:block;filter:drop-shadow(0 0 12px rgba(236,232,220,.14))}
#inspect .snap{display:block;width:min(70vw,20rem);height:auto;max-height:60vh;object-fit:contain;transform:rotate(-3deg);
  box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05)}
#inspect .glint{animation:glint 3.4s ease-in-out infinite}
@keyframes glint{0%,62%,100%{opacity:0}72%,86%{opacity:1}}
/* your heart, on a monitor */
#ecg{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 1.2rem);width:240px;height:56px;transform:translateX(-50%);opacity:0;transition:opacity 1.2s ease}
#ecg.show{opacity:.9}
#inspect::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 2.6px, transparent 2.6px 5.36px)}
@keyframes tremble{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(var(--jx,.03em),var(--jy,-.03em)) rotate(var(--jr,.6deg))}
}
#choices{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:1rem 1.4rem}
.choice{pointer-events:auto;cursor:pointer;font-family:var(--f-sc);font-size:clamp(1.05rem,2.6vw,1.4rem);letter-spacing:.1em;
  color:var(--bone);background:rgba(10,9,8,.82);border:1px solid rgba(238,232,218,.6);
  outline:1px solid rgba(238,232,218,.22);outline-offset:5px;padding:.8em 1.7em;min-width:min(100%,15rem);
  opacity:0;transform:translateY(.6rem);transition:background .25s,color .25s,outline-color .25s}
.choice.show{animation:cardIn .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.choice:hover{background:var(--bone);color:var(--ink);outline-color:rgba(238,232,218,.6)}
.choice:focus-visible{outline:2px solid var(--bone);outline-offset:6px}
.choice:disabled{cursor:default}

#end{justify-content:center;gap:1.6rem;text-align:center;opacity:0;transition:opacity 2.4s ease}
#end.show{opacity:1}
#end h2{margin:0;font-weight:400;line-height:1.05;text-wrap:balance}
#end.good h2{font-family:var(--f-sc);font-size:clamp(2.4rem,8vw,5.5rem);letter-spacing:.32em;padding-left:.32em;color:var(--dawn-ink)}
#end.good p{margin:0;font-style:italic;font-size:clamp(1rem,2.4vw,1.25rem);color:#6b5640}
#end.tbc{justify-content:flex-end;padding-bottom:max(8vh,calc(env(safe-area-inset-bottom,0px) + 4.5rem));background:linear-gradient(to top, rgba(0,0,0,.7), transparent 40%)}
#end.tbc h2{font-family:var(--f-goth);font-size:clamp(2rem,6vw,3.6rem);color:#fffbf1;text-shadow:0 0 .3em rgba(255,236,200,.35)}
#end.open{background:#000}
#end.open h2{font-family:var(--f-goth);font-size:clamp(2.6rem,9vw,6rem);color:#fffbf1;
  text-shadow:0 0 .1em rgba(255,250,232,.85),0 0 .4em rgba(255,236,200,.45),0 0 1.1em rgba(255,226,180,.25);animation:endGlow 4s ease-in-out infinite alternate}
#end.open p{margin:0;font-family:var(--f-fell);font-style:italic;font-size:clamp(1rem,2.6vw,1.35rem);color:#b9b2a3;max-width:30rem;opacity:0;animation:cardIn 2s ease 2.6s forwards}
#end.open #restart{opacity:0;animation:cardIn 1.6s ease 4.2s forwards}
@keyframes endGlow{from{opacity:.78}to{opacity:1}}
#end.fail h2{font-family:var(--f-fell);font-style:italic;font-size:clamp(1.3rem,3.4vw,2rem);max-width:34rem;line-height:1.35}
#restart{pointer-events:auto;cursor:pointer;background:none;border:1px solid currentColor;padding:.7em 1.6em;
  font-family:var(--f-sc);letter-spacing:.14em;font-size:1rem;color:var(--bone)}
#end.good #restart{color:var(--dawn-ink)}
#restart:hover,#restart:focus-visible{background:var(--bone);color:var(--ink)}
#end.good #restart:hover,#end.good #restart:focus-visible{background:var(--dawn-ink);color:var(--dawn)}

/* ---------- flash, loader, chrome ---------- */
#flash{position:fixed;inset:0;z-index:40;background:var(--flash);opacity:0;pointer-events:none}
#loader{position:fixed;inset:0;z-index:50;background:#000;overflow:hidden;transition:opacity 1.6s ease}
#loader.gone{opacity:0;pointer-events:none}
#slit{position:absolute;left:-10%;right:-10%;top:50%;height:64vh;margin-top:-32vh;opacity:0;transform:scaleY(.02);filter:blur(16px);
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,251,240,.95) 0%, rgba(255,248,232,.45) 34%, rgba(255,245,225,0) 70%)}
#haze{position:absolute;inset:0;background:#fffbf2;opacity:0}
#loadText{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);margin:0;padding-inline:16px;text-align:center;
  font-family:var(--f-sc);letter-spacing:.3em;font-size:.85rem;color:#5d584f}
#loadText.err{font-family:var(--f-fell);letter-spacing:0;font-size:1rem;color:var(--bone);bottom:auto;top:50%;transform:translateY(-50%);line-height:1.5}

#sound{position:fixed;z-index:60;left:calc(max(16px,env(safe-area-inset-left,0px)) + .4rem);bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);
  display:flex;align-items:center;gap:.45rem;background:none;border:0;cursor:pointer;padding:.4rem;
  font-family:var(--f-sc);font-size:.8rem;letter-spacing:.18em;color:var(--ash);opacity:.7}
#sound:hover,#sound:focus-visible{opacity:1;color:var(--bone)}
#sound svg{width:1.1rem;height:1.1rem}
#credits{position:fixed;z-index:60;right:calc(max(16px,env(safe-area-inset-right,0px)) + .4rem);bottom:calc(env(safe-area-inset-bottom,0px) + 1.1rem);
  margin:0;max-width:62vw;text-align:right;font-family:var(--f-fell);font-style:italic;font-size:.72rem;line-height:1.4;color:var(--ash);opacity:.6}
#credits a{color:inherit}
#credits a:hover{color:var(--bone)}
body.real #sound,body.real #credits{color:#7a6650}
@media (max-width:560px){#credits{display:none}}

@media (prefers-reduced-motion:reduce){
  #line .ch{animation:none}
  #wake .ch{filter:none}
  #title.ready::before{animation:none}
}
</style>
</head>
<body>

<div id="world">
  <div id="stage">
    <iframe id="vViscera" title="Sublime Viscera scene" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
    <canvas id="warp" hidden aria-hidden="true"></canvas>
    <canvas id="wallEyes" aria-hidden="true"></canvas>
    <canvas id="worldFx" hidden aria-hidden="true"></canvas>
    <div id="bgWrap"><iframe id="vHouse" title="Haunted house (cables.gl)" allow="autoplay" tabindex="-1"></iframe></div>
    <canvas id="yard" aria-hidden="true"></canvas>
    <canvas id="eyes" aria-hidden="true"></canvas>
    <canvas id="fog" aria-hidden="true"></canvas>
  </div>

  <div id="real" hidden aria-hidden="true"></div>
  <img id="keepsake" hidden alt="An instant photo of the round room with the man hanging upside down above the mound. Handwritten underneath: find the truth.">

  <div id="lids" aria-hidden="true"><div class="lid top"></div><div class="lid bottom"></div></div>
  <div id="black" aria-hidden="true"></div>

  <main id="ui">
    <section id="title" hidden>
      <button id="wake" type="button" aria-label="Open your eyes"></button>
      <p class="hint">click to wake</p>
    </section>

    <section id="inspect" hidden></section>

    <section id="dialog" hidden>
      <p id="line" aria-live="polite"></p>
      <div id="choices"></div>
    </section>

    <section id="end" hidden></section>
    <canvas id="ecg" hidden aria-hidden="true"></canvas>
  </main>
</div>

<canvas id="grain" aria-hidden="true"></canvas>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="gate" aria-hidden="true"></div>
<div id="flicker" aria-hidden="true"></div>

<div id="flash" aria-hidden="true"></div>

<div id="loader" role="status">
  <div id="slit"></div>
  <div id="haze"></div>
  <p id="loadText">Loading</p>
</div>

<button id="sound" type="button" aria-pressed="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="w" d="M18 6.5a7.6 7.6 0 0 1 0 11"/>
  </svg>
  <span>Sound on</span>
</button>

<p id="credits">
  <a href="https://cables.gl/p/CmRmF0" target="_blank" rel="noopener">haunted house</a> by nickypy (cables.gl) ·
  <a href="https://sketchfab.com/3d-models/ravencrest-manor-haunted-house-d4dbd3d3911c4920b600056b962a3085" target="_blank" rel="noopener">Ravencrest Manor</a> by Brian Trepanier ·
  <a href="https://sketchfab.com/3d-models/sublime-viscera-visual-immersion-scene-a2f1e0b9be644aa0958548762596748c" target="_blank" rel="noopener">Sublime Viscera</a> by kingklaus · CC BY
</p>

<script>
(() => {
"use strict";

/* ============================================================
   CONFIG
   The house scene is the cables.gl patch, shown through its official embed.
   Its camera can't be steered from outside, so "where you stand" is a virtual
   view {x, z, yaw, h, pitch}: the patch is panned and zoomed, and the graveyard
   and fog layers are drawn in perspective from the same view.
   x = sideways (m), z = towards the house (m), yaw 0 = facing the house, + = turning right.
   ============================================================ */
const CABLES_URL     = "https://cables.gl/view/CmRmF0";
const CABLES_SETTLE  = 6500;   // the patch loads a 24 MB model after its page loads
const VISCERA_UID    = "a2f1e0b9be644aa0958548762596748c";
const VISCERA_CAM    = { p: [0, -6.6, 3.1], t: [0, 0, 2.4], fov: 62 };
const WAKE_MS        = 9500;

const WAKE_SPOT = { x: 0, z: 0, yaw: 0, h: 1.6, pitch: 0, zoom: 0 };
const DOOR = { x: 0, z: 66, yaw: 0, h: 1.6, pitch: 0, zoom: 0.45 };

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
const rand = (a, b) => a + Math.random() * (b - a);

const els = {
  world: $("#world"), stage: $("#stage"), bgWrap: $("#bgWrap"), vHouse: $("#vHouse"), vViscera: $("#vViscera"),
  yard: $("#yard"), fog: $("#fog"), wallEyes: $("#wallEyes"), warp: $("#warp"), worldFx: $("#worldFx"), ecg: $("#ecg"), keepsake: $("#keepsake"), real: $("#real"), eyes: $("#eyes"), inspect: $("#inspect"),
  lidTop: $(".lid.top"), lidBot: $(".lid.bottom"), black: $("#black"),
  grain: $("#grain"), dust: $("#dust"), flicker: $("#flicker"),
  title: $("#title"), wake: $("#wake"), dialog: $("#dialog"), line: $("#line"), choices: $("#choices"), end: $("#end"),
  flash: $("#flash"), loader: $("#loader"), slit: $("#slit"), haze: $("#haze"), loadText: $("#loadText"),
  sound: $("#sound")
};

let visceraApi = null, visceraP = null, visceraProgress = 0;

/* ============================================================
   VIEW — the virtual camera, with tweens
   ============================================================ */
const EASE = {
  linear: p => p, in: p => p * p, out: p => 1 - (1 - p) * (1 - p),
  inOut: p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,

/* ============================================================
   MUSIC — two tracks kept next to index.html: one for outside the house, one for inside.
   If they are missing, the game simply plays without them.
   ============================================================ */
const Music = (() => {
  const T = {
    outside: { src: "music-outside.mp3", vol: 0.5 },
    inside:  { src: "music-inside.mp3",  vol: 0.55, gapless: true }
  };
  const viaGraph = location.protocol !== "file:";   // a page opened from disk cannot route its own audio files through Web Audio
  let cur = null, muted = false;
  function element(t) {
    if (!t.el) {
      t.el = new Audio(); t.el.src = t.src; t.el.loop = true; t.el.preload = "auto"; t.el.volume = 0;
      t.el.addEventListener("playing", () => { if (cur === t) Sound.quietDrone(true); });
    }
    return t.el;
  }
  function gainOf(t) {
    if (!viaGraph || !Sound.ctx) return null;
    if (!t.gain) { t.gain = Sound.ctx.createGain(); t.gain.gain.value = 0.0001; t.gain.connect(Sound.out); }
    return t.gain;
  }
  // the inside track loops without a seam: decoded once and played from memory
  function loadBuffer(t) {
    if (t.bufP) return t.bufP;
    t.bufP = fetch(t.src).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => Sound.ctx.decodeAudioData(ab, res, rej)))
      .then(buf => {   // skip the encoder's silent padding at either end
        const ch = buf.getChannelData(0); let a = 0, b = ch.length - 1;
        while (a < b && Math.abs(ch[a]) < 1e-4) a++;
        while (b > a && Math.abs(ch[b]) < 1e-4) b--;
        t.span = [a / buf.sampleRate, (b + 1) / buf.sampleRate];
        return buf;
      })
      .catch(e => { console.warn("Music not found:", t.src, e.message || e); return null; });
    return t.bufP;
  }
  function ramp(t, v, sec) {
    const g = gainOf(t);
    if (g) {
      const now = Sound.ctx.currentTime;
      g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), now);
      g.gain.linearRampToValueAtTime(Math.max(v, 0.0001), now + Math.max(sec, 0.01));
      return;
    }
    // without Web Audio: step the element's own volume (an iPhone ignores this and plays at full volume)
    clearInterval(t.fade);
    const el = element(t), from = el.volume, t0 = performance.now();
    t.fade = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / Math.max(sec * 1000, 1));
      el.volume = Math.max(0, Math.min(1, from + (v - from) * k));
      if (k >= 1) clearInterval(t.fade);
    }, 50);
  }
  function startElement(t) {
    const el = element(t);
    if (viaGraph && Sound.ctx && !t.wired) {
      try { Sound.ctx.createMediaElementSource(el).connect(gainOf(t)); t.wired = true; el.volume = 1; } catch (e) {}
    }
    const p = el.play(); if (p && p.catch) p.catch(() => {});
  }
  function start(t) {
    if (!(viaGraph && Sound.ctx && t.gapless)) { startElement(t); return; }
    loadBuffer(t).then(buf => {
      if (cur !== t) return;
      if (!buf) { startElement(t); return; }
      stopSource(t);
      const s = Sound.ctx.createBufferSource();
      s.buffer = buf; s.loop = true; s.loopStart = t.span[0]; s.loopEnd = t.span[1];
      s.connect(gainOf(t)); s.start(0, t.span[0]); t.node = s;
      Sound.quietDrone(true);
    });
  }
  function stopSource(t) { if (t.node) { try { t.node.stop(); } catch (e) {} t.node = null; } }
  function halt(t) { if (cur === t) return; stopSource(t); if (t.el) t.el.pause(); }
  return {
    unlock() {   // called inside the first click, so the browser lets both tracks play later on
      if (!Sound.ctx) return;
      Object.values(T).forEach(t => {
        if (t.gapless && viaGraph) { loadBuffer(t); return; }
        const el = element(t), p = el.play();
        if (p && p.then) p.then(() => { if (cur !== t) el.pause(); }).catch(() => {});
      });
    },
    play(name, sec = 4) {
      const t = T[name];
      if (!t || cur === t || !Sound.ctx) return;
      const prev = cur; cur = t;
      start(t); ramp(t, t.vol, sec);
      if (prev) { ramp(prev, 0, sec); setTimeout(() => halt(prev), sec * 1000 + 200); }
    },
    stop(sec = 2) {
      const t = cur; if (!t) return;
      cur = null; ramp(t, 0, sec); setTimeout(() => halt(t), sec * 1000 + 200);
      Sound.quietDrone(false);
    },
    mute(m) { muted = m; Object.values(T).forEach(t => { if (t.el && !t.wired) t.el.muted = m; }); },
    get playing() { return !!cur; }
  };
})();

/* ============================================================

(() => {
  const g = els.grain, gx = g.getContext("2d");
  const d = els.dust, dx = d.getContext("2d");
  const frames = [];

    const img = gx.createImageData(W, H), p = img.data;
    for (let i = 0; i < p.length; i += 4) { const v = Math.random() * 255 | 0; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255; }
    frames.push(img);
  }
  function resize() { dpr = 1; d.width = innerWidth; d.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  function drawDust() {
    dx.clearRect(0, 0, d.width, d.height);

      els.flicker.style.opacity = REDUCED || real ? 0 : (Math.random() * 0.07 + (Math.random() < 0.03 ? 0.12 : 0)).toFixed(3);

/* ============================================================
   FX — one loop: virtual camera, background, graveyard, fog,
   sway, walking bob, hits, trembling and blur
   ============================================================ */
const FX = {
  sway: 0, swayT: 0, bob: 0, bobT: 0, stepDur: 0.55, phase: 0,
  trauma: 0, page: 0, pageT: 0, tilt: 0, tiltT: 0, drop: 0, dropT: 0, scale: 1.04, scaleT: 1.04,
  blur: 0, blurT: 0, blurRate: 2.5, bright: 1, brightT: 1, split: 0, splitT: 0, hook: null,
  kick(v) { this.trauma = Math.min(1.25, this.trauma + v); },
  jump(o) { for (const k in o) { this[k] = o[k]; if ((k + "T") in this) this[k + "T"] = o[k]; } }
};
const nz = (t, a, b, c) => Math.sin(t * a) * 0.5 + Math.sin(t * b + 1.3) * 0.3 + Math.sin(t * c + 2.1) * 0.2;
let fxLast = performance.now(), stageFilter = "", stageTf = "";
// if the frame rate stays low, render the house and fog smaller (up to three steps)
let perfFrames = 0, perfTime = 0, perfHold = 0, perfOn = false;
function watchFrameRate(now, dt) {
  if (!perfOn || document.hidden || mosaicBlock > 1 || qLevel >= 3) return;
  if (now < perfHold) { perfFrames = 0; perfTime = 0; return; }
  perfFrames++; perfTime += dt;
  if (perfTime < 2.5) return;
  const fps = perfFrames / perfTime;
  perfFrames = 0; perfTime = 0;
  if (fps < 42) {
    qLevel++;
    applyHouseSize(); FogGL.resize();
    perfHold = now + 2500;   // let it settle before judging again
  }
}
function fxFrame(now) {
  const dt = Math.min(0.05, (now - fxLast) / 1000); fxLast = now;
  const T = now / 1000, m = REDUCED ? 0.2 : 1;
  const ease = (cur, tgt, rate) => cur + (tgt - cur) * (1 - Math.exp(-dt * rate));
  if (FX.hook) FX.hook(now);
  View.step(now);
  if (View.drift) {                       // the title: a slow, uneasy drift in front of the house
    View.yaw = 0.07 * Math.sin(T * 0.11); View.z = 2 + 2.5 * Math.sin(T * 0.07); View.x = 0.8 * Math.sin(T * 0.05);
  }
  FX.sway = ease(FX.sway, FX.swayT, 1.2); FX.bob = ease(FX.bob, FX.bobT, 3); FX.page = ease(FX.page, FX.pageT, 5);
  FX.tilt = ease(FX.tilt, FX.tiltT, 3); FX.drop = ease(FX.drop, FX.dropT, 3); FX.scale = ease(FX.scale, FX.scaleT, 2);
  FX.blur = ease(FX.blur, FX.blurT, FX.blurRate); FX.bright = ease(FX.bright, FX.brightT, 2.5); FX.split = ease(FX.split, FX.splitT, 1.5);
  FX.trauma = Math.max(0, FX.trauma - dt * 0.55);

  // stage: drunk sway + walking bob + hit shake + tilt
  const s = FX.sway * m;
  let x = s * (30 * Math.sin(T * 1.25) + 10 * Math.sin(T * 3.4 + 0.7));
  let y = s * (18 * Math.sin(T * 1.05 + 1.2) + 7 * Math.sin(T * 4.1));
  let r = s * (2.4 * Math.sin(T * 0.85 + 0.4) + 0.7 * Math.sin(T * 2.7));
  const prev = FX.phase; FX.phase += dt / FX.stepDur;
  if (FX.bob > 0.35 && Math.floor(FX.phase) !== Math.floor(prev)) Sound.step(FX.stepDur < 0.42);
  const b = FX.bob * m, sp = Math.sin(Math.PI * FX.phase);
  y += -b * 8 * Math.abs(sp); x += b * 5 * sp; r += b * 0.5 * sp;
  const tr = FX.trauma * FX.trauma * m;
  x += tr * 60 * nz(T * 9, 3.1, 5.7, 9.3); y += tr * 45 * nz(T * 9 + 5, 2.7, 6.1, 8.9); r += tr * 7 * nz(T * 9 + 9, 2.3, 4.9, 7.7);
  r += FX.tilt; y += FX.drop;
  const stf = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${FX.scale.toFixed(3)})`;
  if (stf !== stageTf) { stageTf = stf; els.stage.style.transform = stf; }
  watchFrameRate(now, dt);

  // the whole page trembling (crouched, holding your head)
  const p = FX.page * m;
  if (p > 0.002) {
    els.world.style.transform = `translate(${(p * 26 * nz(T * 14, 3.3, 7.1, 11.7)).toFixed(2)}px,${(p * 20 * nz(T * 14 + 3, 2.9, 6.6, 12.4)).toFixed(2)}px) rotate(${(p * 2.4 * nz(T * 14 + 7, 3.7, 5.3, 9.9)).toFixed(3)}deg)`;
  } else if (els.world.style.transform) els.world.style.transform = "";

  // blur / brightness of what you see
  const filt = (FX.blur > 0.05 || Math.abs(FX.bright - 1) > 0.01) ? `blur(${FX.blur.toFixed(2)}px) brightness(${FX.bright.toFixed(3)})` : "none";
  if (filt !== stageFilter) { stageFilter = filt; els.stage.style.filter = filt; }

  const bgVis = applyBackground();
  Giant.update(now);
  Yard.draw(View, FX.split, T);
  Eyes.draw(View, now);
  FogGL.draw(now, dt, View, bgVis);
  requestAnimationFrame(fxFrame);
}
requestAnimationFrame(fxFrame);

/* ============================================================
   EYELIDS, BLACK, FLASH
   ============================================================ */
let lidV = 0;   // 0 open … 1 shut
const lidY = (side, v) => `translateY(${side * (110 - v * 98)}%)`;
function lidsAnim(frames, ms, easing = "ease-in-out") {
  const kf = side => frames.map(([o, v]) => ({ offset: o, transform: lidY(side, v) }));
  els.lidTop.getAnimations().forEach(a => a.cancel()); els.lidBot.getAnimations().forEach(a => a.cancel());
  els.lidTop.animate(kf(-1), { duration: ms, easing, fill: "forwards" });
  const a = els.lidBot.animate(kf(1), { duration: ms, easing, fill: "forwards" });
  lidV = frames[frames.length - 1][1];
  return a.finished.catch(() => {});
}
const lidsTo = (v, ms, easing) => lidsAnim([[0, lidV], [1, v]], Math.max(ms, 1), easing);

let blackV = 0;
function blackTo(v, ms) {
  els.black.getAnimations().forEach(a => a.cancel());
  const a = els.black.animate([{ opacity: blackV }, { opacity: v }], { duration: Math.max(ms, 1), easing: "ease-in-out", fill: "forwards" });
  blackV = v;
  return a.finished.catch(() => {});
}
function flashTo(v, ms, easing = "ease-out") {
  const from = getComputedStyle(els.flash).opacity;
  els.flash.getAnimations().forEach(a => a.cancel());
  return els.flash.animate([{ opacity: from }, { opacity: v }], { duration: Math.max(ms, 1), easing, fill: "forwards" }).finished.catch(() => {});
}
function pulseFlash(peak, inMs, outMs) {
  els.flash.getAnimations().forEach(a => a.cancel());
  return els.flash.animate([{ opacity: 0 }, { opacity: peak, offset: inMs / (inMs + outMs) }, { opacity: 0 }],
    { duration: inMs + outMs, easing: "ease-out", fill: "forwards" }).finished.catch(() => {});
}
/* ============================================================
   LOADER — black, with faint attempts to open your eyes
   ============================================================ */
const Loader = (() => {
  let on = false, timer = null, textFn = null, textTimer = null;
  function attempt() {
    if (!on) return;
    const peak = rand(0.12, 0.38), open = rand(0.1, 0.42), ms = rand(650, 1300);
    els.slit.animate([
      { opacity: 0, transform: "scaleY(.02)" },
      { opacity: peak, transform: `scaleY(${open})`, offset: 0.42 },
      { opacity: peak * 0.75, transform: `scaleY(${open * 0.8})`, offset: 0.6 },
      { opacity: 0, transform: "scaleY(.02)" }

    if (Math.random() < 0.45) els.haze.animate([{ opacity: 0 }, { opacity: rand(0.03, 0.08), offset: 0.4 }, { opacity: 0 }], { duration: ms * 0.9 });
    const flutter = Math.random() < 0.3;

  }
  return {
    show(fn) {

/* ============================================================

   ============================================================ */
const TYPE = {   // [ms per letter, random extra, pause on …, jitter in em]
  q:       [95, 70, 900, 0.08],
  shout:   [34, 26, 380, 0.16],
  thought: [62, 40, 700, 0],
  inner:   [62, 40, 700, 0],
  real:    [55, 30, 600, 0]

async function say(text, style = "q") {
  els.dialog.hidden = false;
  els.dialog.classList.remove("dim");
  els.dialog.classList.toggle("center", style === "voice" || style === "thought");
  els.dialog.classList.toggle("light", style === "real");
  els.line.className = style;
  els.line.textContent = "";

    els.line.textContent = text;
    els.line.animate([{ opacity: 0, transform: "scale(1.18)", filter: "blur(10px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }],
      { duration: 160, easing: "ease-out" });

  }
  const [base, extra, pause, jit] = TYPE[style];

  }
}
async function clearLine(fade = true) {

  els.line.textContent = ""; els.line.className = "";
}

function showEnd(kind, sub) {

  function guess(now) {   // eased like Sketchfab's own move, for the plain embed or a slow answer

      catch (e) { waiting = false; }

    use() { users++; if (!raf) raf = requestAnimationFrame(poll); },
    release() { users = Math.max(0, users - 1); },
    target(shot, sec) { from = cam || (to && guess(performance.now())) || null; to = { p: shot.p, t: shot.t }; t0 = performance.now(); dur = sec; },

// Tension: how hard you move the mouse (or your finger), click and press keys.
const Tension = (() => {
  let T = 0, base = 0, on = false, lx = 0, ly = 0, lt = 0, lastSpike = 0, spikeFn = null;
  const pointer = { x: innerWidth / 2, y: innerHeight / 2, t: -1e9 };
  const bump = v => { if (on) T = Math.min(1, T + v); };
  addEventListener("pointermove", e => {
    const now = performance.now();
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = now;
    if (!on) { lx = e.clientX; ly = e.clientY; lt = now; return; }
    const dt = Math.max(8, now - lt), d = Math.hypot(e.clientX - lx, e.clientY - ly);
    lx = e.clientX; ly = e.clientY; lt = now;
    if (dt > 200) return;
    const v = d / dt / (Math.max(innerWidth, innerHeight) / 1000);   // screen widths per second, roughly
    bump(Math.min(v, 5) * 0.006);
    if (v > 2.4 && now - lastSpike > 700) { lastSpike = now; if (spikeFn) spikeFn(Math.min(1, v / 5)); }
  }, { passive: true });
  addEventListener("pointerdown", () => {
    if (!on) return;
    bump(0.12);
    const now = performance.now();
    if (now - lastSpike > 400) { lastSpike = now; if (spikeFn) spikeFn(0.8); }
  }, { passive: true });
  addEventListener("keydown", () => bump(0.05));
  setInterval(() => { if (on) T = Math.max(base, T - 0.012); }, 50);   // you calm down when you keep still
  return {
    get value() { return on ? T : 0; },
    pointer,
    start() { on = true; },
    stop() { on = false; T = 0; base = 0; spikeFn = null; },
    setBase(b) { base = b; T = Math.max(T, b); },
    onSpike(f) { spikeFn = f; },
    bump
  };
})();

// Your heart: faster the tenser you are. Everything that moves with it listens here.
const Heart = (() => {
  let on = false, timer = null, vol = 0.4;
  const fns = [];
  function beat() {
    if (!on) return;
    const T = Tension.value, gap = 60000 / (62 + 108 * T);
    if (Sound.ctx) {
      const t = Sound.ctx.currentTime + 0.02;
      Sound.thump(t, 0.85 * vol); Sound.thump(t + Math.min(0.24, gap / 1000 * 0.3), 0.55 * vol);
    }
    fns.forEach(f => f(gap, T));
    timer = setTimeout(beat, gap);
  }
  return {
    start(v) { vol = v; if (on) return; on = true; beat(); },
    stop() { on = false; clearTimeout(timer); },
    volume(v) { vol = v; },
    on(f) { fns.push(f); },
    get running() { return on; }

      const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
      m[i] = clamp01((r - 0.5 * (g + b) - 6) / 40) * clamp01((r + g + b) / 3 / 35);
    }
    return m;
  }
  function blur(m, w, h, passes) {
    const t = new Float32Array(m.length);
    for (let p = 0; p < passes; p++) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0, n = 0; for (let k = -2; k <= 2; k++) { const xx = x + k; if (xx >= 0 && xx < w) { s += m[y * w + xx]; n++; } } t[y * w + x] = s / n; }
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0, n = 0; for (let k = -2; k <= 2; k++) { const yy = y + k; if (yy >= 0 && yy < h) { s += t[yy * w + x]; n++; } } m[y * w + x] = s / n; }
    }
    return m;
  }
  function frame(now) {
    if (!on) return;
    requestAnimationFrame(frame);
    const k = clamp01((now - at0) / adur); amp = a0 + (a1 - a0) * (k * k * (3 - 2 * k));
    gl.uniform1f(U.uTime, (now - t0) / 1000); gl.uniform1f(U.uAmp, amp);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  return {
    async setup(api) {
      if (!gl && !init()) return false;
      const W = innerWidth, H = innerHeight, img = await freshVShot(api);
      if (!img) return false;
      mw = Math.ceil(W / 8); mh = Math.ceil(H / 8);
      const cm = colorMask(img, mw, mh), pm = await pickMask(api, W, H, 24), m = new Float32Array(mw * mh);
      for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
        let v = cm[j * mw + i];
        if (pm) {   // the model's answer, smoothly, trimmed by colour
          const fx = Math.max(0, Math.min(pm.cols - 1.001, (i + 0.5) * 8 / pm.step - 0.5)), fy = Math.max(0, Math.min(pm.rows - 1.001, (j + 0.5) * 8 / pm.step - 0.5));
          const x0 = Math.floor(fx), y0 = Math.floor(fy), ax = fx - x0, ay = fy - y0, M = (x, y) => pm.m[y * pm.cols + x];
          const p = (M(x0, y0) * (1 - ax) + M(x0 + 1, y0) * ax) * (1 - ay) + (M(x0, y0 + 1) * (1 - ax) + M(x0 + 1, y0 + 1) * ax) * ay;
          v = p * (0.35 + 0.65 * v);
        }
        m[j * mw + i] = v;
      }
      blur(m, mw, mh, 2);
      const bytes = new Uint8Array(mw * mh); for (let i = 0; i < bytes.length; i++) bytes[i] = Math.round(clamp01(m[i] * 1.6) * 255);
      c.width = W; c.height = H; gl.viewport(0, 0, W, H);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tImg); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tMask); gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, mw, mh, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, bytes);
      gl.uniform1i(U.uImg, 0); gl.uniform1i(U.uMask, 1); gl.uniform2f(U.uTexel, 1.5 / mw, 1.5 / mh);
      return true;
    },
    show() { if (!gl) return; on = true; t0 = at0 = performance.now(); a0 = a1 = amp = 0; c.hidden = false; requestAnimationFrame(frame); },
    ramp(to, ms) { a0 = amp; a1 = to; at0 = performance.now(); adur = Math.max(1, ms); },
    hide() { on = false; c.hidden = true; }
  };
})();

async function enterBuilding() {
  els.dialog.classList.add("dim");
  await sleep(900);
  await clearLine(false);
  Sound.creak(); Sound.breath(false); Sound.heartbeat(false);
  View.to({ z: 71, zoom: 1.3 }, 1.8, "in");
  Music.stop(1.8);
  await blackTo(1, 1600);
  FogGL.off();
  Yard.show(false); Eyes.show(false); Giant.show(false);
  View.bgFade = 0;
  startViscera();
  els.vViscera.classList.add("here");   // on screen (still transparent) so it can finish loading
  if (!visceraApi) {
    Loader.show(() => visceraProgress > 0 ? "Loading " + Math.round(visceraProgress * 100) + "%" : "Loading");
    try { await withTimeout(visceraP, 120000); } catch (e) { console.warn(e); }
    Loader.hide();
  }
  if (!visceraApi) { showEnd("fail"); return; }
  Music.play("inside", 7);                // the music inside the house
  els.vHouse.src = "about:blank";   // the house is behind you now; free its graphics memory
  els.vViscera.style.opacity = "1";
  const api = insideApi();
  if (api) Room.init(api);
  LiveCam.target(VISCERA_CAM, 0);
  FX.jump({ blur: 10, bright: 1.35, sway: 0.5 }); FX.swayT = 0.1; FX.blurRate = 0.55;
  lidsTo(1, 1);
  await sleep(200);
  await blackTo(0, 400);
  Sound.heartbeat(true, 820, 1.03);
  FX.blurT = 0; FX.brightT = 1;
  await lidsAnim([[0, 1], [0.3, 0.5], [0.42, 0.85], [0.65, 0.18], [0.76, 0.3], [1, 0]], 5200);
  await sleep(900);
  Sound.heartbeat(false);
  FX.blurRate = 2.5;
  return theRoom();
}

let pulseTimer = null;
function heartPulse(on, gap = 900) {      // the room swells a little with each beat of your heart
  clearInterval(pulseTimer);
  if (!on || REDUCED) return;
  pulseTimer = setInterval(() => { FX.scale += 0.012; setTimeout(() => { FX.scale += 0.007; }, 240); }, gap);
}
let heartShakes = 0;   // how hard each of your heartbeats knocks the room about
Heart.on(() => { if (heartShakes && !REDUCED) { FX.scale += 0.006 * heartShakes; setTimeout(() => { FX.scale += 0.004 * heartShakes; }, 220); } });

async function openWallEyes(shot, n, quick) {
  const api = insideApi();
  if (!api) return false;
  const q = projectShot(HEAD, shot);
  WallEyes.setTarget(q.x, q.y - innerHeight * 0.08);
  if (!await WallEyes.setupWalls(api, shot, n)) return false;
  WallEyes.start();
  if (quick) WallEyes.openAll(1.4); else WallEyes.openOneByOne(1100);
  return true;
}
async function shutWallEyes() { WallEyes.closeAll(1.4); await sleep(750); WallEyes.stop(); }
// the eyes in the walls follow your hand to whichever answer you are about to give
function choiceWithEyes(list, gaze) {
  const pick = choose(list);
  els.choices.querySelectorAll("button").forEach((b, i) => {
    const how = gaze[list[i][0]];
    if (!how) return;
    const on = () => WallEyes.focus(how), off = () => WallEyes.focus(null);
    b.addEventListener("pointerenter", on); b.addEventListener("focus", on);
    b.addEventListener("pointerleave", off); b.addEventListener("blur", off);
  });
  return pick;
}

async function theRoom() {
  Tension.start(); Tension.setBase(0.05);
  Tension.onSpike(k => {   // move suddenly and the room flinches with you
    Room.twitch(1 + Math.round(k * 3), 6 + 8 * k);
    if (k > 0.5) Room.flinch();
    Sound.wet(0.25 + 0.5 * k);
  });
  Heart.start(0.28);
  // the first thing you see is flesh: a mound of it, full of hands
  await sleep(500);
  Sound.wet(0.5); Room.twitch(3, 8);
  await vcamTo(SHOT_FLESH, 5.5);
  await sleep(900);
  Room.twitch(7, 12); Sound.wet(0.9);        // they know you're here
  await sleep(2200);
  // something drips on you from above
  Sound.drip(); await sleep(1500); Sound.drip(); await sleep(900);
  Sound.rope();
  await vcamTo(SHOT_UP, 5.2);                 // and you look up. Someone hangs there, upside down.
  Heart.volume(0.42); Tension.setBase(0.12);
  Sound.rope();
  if (await openWallEyes(SHOT_UP, 11) && WallEyes.image) dreamPhoto = makeDreamPhoto(WallEyes.image);
  await sleep(5200);
  await say("Is he… the dreamer?", "thought");
  await sleep(2200);
  await clearLine();
  return explore();
}

async function explore() {
  const seen = { left: false, right: false };
  for (;;) {
    const opts = [];
    if (!seen.left) opts.push(["left", "go left"]);
    if (!seen.right) opts.push(["right", "go right"]);
    if (seen.left || seen.right) opts.push(["guts", "watch the intestines"], ["him", "look up at him"]);
    const c = await choiceWithEyes(opts, { left: "left", right: "right", guts: "down", him: "him" });
    if (c === "left") { await goLeft(); seen.left = true; }
    else if (c === "right") { await goRight(); seen.right = true; }
    else if (c === "guts") return watchGuts();
    else return lookAtHim();
  }
}

async function walkTo(shot, sec) {
  FX.bobT = 0.6; FX.stepDur = 0.62;
  await vcamTo(shot, sec);
  FX.bobT = 0;
}
async function walkBack() {
  els.dialog.classList.add("dim");
  await walkTo(SHOT_UP, 4.4);
  WorldFx.hide("carving"); WorldFx.hide("floor");
  await openWallEyes(SHOT_UP, 11, true);
  await sleep(900);
}

async function goLeft() {               // the pillar: someone counted days on it, and cut one word
  els.dialog.classList.add("dim");
  await shutWallEyes();
  WorldFx.show("carving");
  await walkTo(SHOT_LEFT, 4.4);
  await sleep(1100);
  await inspect(pillarSVG());
  await sleep(700);
  await say("TRUTH… carved upside down.", "inner");
  await sleep(1500);
  await choose([["back", "step back"]]);
  closeInspect(); clearLine();
  await walkBack();
}

async function goRight() {              // a broken tile, and a photo lying next to it
  els.dialog.classList.add("dim");
  await shutWallEyes();
  WorldFx.show("floor");
  await walkTo(SHOT_RIGHT, 4.8);
  await sleep(900);
  await vcamTo(SHOT_KNEEL, 2.6);         // you crouch down
  WorldFx.glint(true);
  await sleep(900);
  await inspect(floorSVG());
  await sleep(500);
  await choose([["take", "pick up the photo"]]);
  els.dialog.classList.add("dim");
  await swapInspect(polaroidHTML());
  await sleep(600);
  await say("This room… I know this room.", "inner");
  await sleep(1800);
  await say("This was before I came to this damn place.", "inner");
  await sleep(1600);
  await choose([["back", "put it down"]]);
  closeInspect(); clearLine(); WorldFx.glint(false);
  await walkBack();
}

let gurgleTimer = null;
function gurgles(on, every = 1400) {
  clearTimeout(gurgleTimer);
  if (!on) return;
  (function g() { Sound.gurgle(); gurgleTimer = setTimeout(g, rand(every * 0.5, every * 1.3)); })();
}

async function watchGuts() {            // look long enough and they are moving
  const api = insideApi();
  els.dialog.classList.add("dim");
  await shutWallEyes();
  FX.bobT = 0.35; await vcamTo(SHOT_GUT, 4.2); FX.bobT = 0;
  Heart.volume(0.55); Tension.setBase(0.22);
  await sleep(600);
  const warped = !!api && await FleshWarp.setup(api);
  if (warped) { FleshWarp.show(); FleshWarp.ramp(0.45, 6000); }
  Room.gut(!warped, 0.16);   // without the still, swell the real ones instead
  gurgles(true, 1700);
  await sleep(4200);
  await say("They're… moving.", "inner");
  await sleep(2400);
  await clearLine();
  if (warped) FleshWarp.ramp(1.05, 4500);
  Room.gut(!warped, 0.3);
  Tension.setBase(0.4); Room.twitch(6, 12); gurgles(true, 800);
  await sleep(5200);
  // one of them lunges at you
  if (warped) FleshWarp.ramp(2.6, 260);
  Sound.lunge(); FX.kick(1.1); Room.flinch(); Room.twitch(10, 16);
  await sleep(240);
  await blackTo(1, 80);
  FleshWarp.hide(); Room.gut(false); gurgles(false);
  if (api) { try { api.setCameraLookAt(SHOT_UP.p, SHOT_UP.t, 0); } catch (e) {} }
  LiveCam.target(SHOT_UP, 0);
  await sleep(700);
  await openWallEyes(SHOT_UP, 13, true);
  WallEyes.stare();                      // and when you look up, every eye is on you
  Sound.squelch();
  await blackTo(0, 260);
  Tension.setBase(0.3);
  await sleep(2600);
  const c = await choiceWithEyes([["open", "open his eyes"], ["close", "close your eyes"]], { open: "him", close: "you" });
  return c === "open" ? openHisEyes() : closeYourEyes();
}

function leaveRoom() {                  // stop everything that was answering you
  Heart.stop(); Tension.stop(); Room.reset(); gurgles(false); heartShakes = 0;
  WorldFx.hideAll(); FleshWarp.hide(); ECG.hide();
}

async function lookAtHim() {            // close enough to touch him. Then the hands come up out of the flesh for you both.
  const api = insideApi();
  els.dialog.classList.add("dim");
  await shutWallEyes();
  Heart.volume(0.8); heartShakes = 1; Tension.setBase(0.12);
  Room.breathe(true);                    // his chest rises and falls with your heart
  Sound.rope();
  FX.swayT = 0.2;                        // you rise up to him, as you only can in a dream
  await vcamTo(SHOT_NEAR, 6.5);
  FX.swayT = 0.1;
  await sleep(1800);
  await say("His chest… it moves with my heartbeat.", "inner");
  ECG.show();
  await sleep(2800);
  await clearLine();
  Room.twitch(14, 16); Sound.wet(0.9); FX.kick(0.25);   // something moves, far below
  await sleep(800);
  await vcamTo(SHOT_DOWN, 3.4);          // you look down
  const C = SHOT_WRAP.p, V = V3.norm(V3.sub(SHOT_WRAP.t, C)), rt = V3.norm(V3.cross(V, [0, 0, 1])), upv = V3.cross(rt, V);
  const toHim = Array.from({ length: 16 }, (_, i) => {
    if (i < 3) return V3.add(HEAD, [rand(-0.08, 0.08), rand(-0.12, 0.04), rand(-0.1, 0.05)]);
    const a = i / 16 * Math.PI * 2 + rand(-0.2, 0.2), r = rand(0.13, 0.19);
    return [BODY_AXIS[0] + Math.cos(a) * r, BODY_AXIS[1] + Math.sin(a) * r, rand(5.8, 6.9)];
  });
  const toYou = Array.from({ length: 12 }, () => V3.add(C, V3.add(V3.add(V3.mul(rt, rand(-0.42, 0.42)), V3.mul(upv, rand(-0.4, 0.15))), V3.mul(V, rand(0.12, 0.34)))));
  if (api && Room.canReach) Room.prepareReach(toHim, toYou);
  Sound.grow(4);
  let p = 0, last = performance.now(), nextGrow = last + 3500, lookedUp = false, said = false;
  while (p < 1) {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    p = Math.min(1, p + dt * (0.028 + 0.07 * Tension.value));   // the more scared you are, the faster they come
    Room.reachTo(p);
    Tension.setBase(0.15 + 0.5 * p);
    if (!said && p > 0.06) { said = true; say("Calm down… calm down…", "inner").then(() => sleep(2400)).then(() => clearLine()); }
    if (!lookedUp && p > 0.42) { lookedUp = true; vcamTo(SHOT_WRAP, 3.6); }   // back up at him, as they take hold of him
    if (p > 0.55) { const k = smooth(0.55, 1, p); WorldFx.dark(k * 0.96); FX.tiltT = 14 * k; FX.swayT = 0.1 + 0.4 * k; }
    if (now > nextGrow) { Sound.grow(3); if (Math.random() < 0.6) Sound.wet(0.6); nextGrow = now + rand(2200, 4200); }
    await sleep(40);
  }
  // then nothing
  Music.stop(0.3);
  Heart.stop(); ECG.flat(); Room.breathe(false);
  Sound.droneTo(0.0001, 0.3); Sound.tinnitus(4);
  await blackTo(1, 500);
  await sleep(1400);
  leaveRoom();
  FX.jump({ tilt: 0, scale: 1.04, sway: 0 });
  await sleep(1400);
  return goodEnd({ fromRoom: true, photo: dreamPhoto });
}

async function openHisEyes() {
  const api = insideApi();
  els.dialog.classList.add("dim");
  Heart.stop(); Tension.stop();
  WallEyes.stare();                            // every eye in the walls turns to you
  Sound.squelch();
  await sleep(2200);
  WallEyes.closeAll(1.6);
  await sleep(900);
  WallEyes.stop();
  Sound.heartbeat(true, 640, 0.97); heartPulse(true, 640);
  Sound.rope();
  await vcamTo(SHOT_FACE, 3.8);                // up, to his wrapped face, hanging the wrong way up
  await sleep(600);
  if (api && await WallEyes.setupFace(api, SHOT_FACE)) {
    WallEyes.start(); WallEyes.focus("you");
    await sleep(1200);
    WallEyes.openAll(0.26);                    // slowly, between the bandages
    await sleep(4600);
    WallEyes.dilate(1);                        // and the pupils widen, taking you in
    await sleep(2600);
  } else {
    await sleep(2400);
  }
  // then nothing at all
  Music.stop(0.5);
  Sound.heartbeat(false); heartPulse(false);
  Sound.droneTo(0.0001, 0.4);
  await sleep(1700);
  pulseFlash(1, 40, 1100);
  blackTo(1, 1);
  WallEyes.stop(); leaveRoom();
  await sleep(2000);
  Sound.morning();                             // somewhere, someone is waking up
  await sleep(3200);
  Sound.stopMorning();
  await sleep(1000);
  if (Sound.ctx) { const t = Sound.ctx.currentTime + 0.02; Sound.thump(t, 0.9); Sound.thump(t + 0.24, 0.6); }
  await sleep(1400);
  showEnd("open");
}

async function closeYourEyes() {
  els.dialog.classList.add("dim");
  WallEyes.focus("you");
  Heart.stop(); Tension.stop(); Music.stop(3.5);
  Sound.heartbeat(true, 1000, 1.06); heartPulse(false);
  await sleep(900);
  WallEyes.closeAll(0.5);
  await lidsTo(1, 3400, "ease-in");
  await sleep(1400);
  Sound.heartbeat(false);
  await blackTo(1, 300);
  WallEyes.stop(); leaveRoom();
  try { localStorage.setItem("oye-again", "1"); } catch (e) {}
  await sleep(1600);
  location.reload();                           // …and you wake among the graves again
}

async function goodEnd(opts = {}) {
  els.dialog.classList.add("dim");
  Music.stop(opts.fromRoom ? 0.3 : 4.5);
  if (!opts.fromRoom) {
    Sound.breath(false); Sound.heartbeat(true, 950, 1.08); Sound.droneTo(0.0001, 4);
    FX.swayT = 0.15; FX.splitT = 0; FX.blurT = 4; FX.blurRate = 0.8;
    FogGL.target(0.2);
    await lidsTo(1, 3800, "ease-in");
    await sleep(1400);
    Sound.heartbeat(false);
    await sleep(1600);
  } else {
    await lidsTo(1, 1);                        // you are already in the dark
  }
  // under closed eyes: the real world
  View.bgFade = 0; Yard.show(false); FogGL.off(); Eyes.show(false); Giant.show(false);
  els.vHouse.src = "about:blank"; els.vViscera.style.opacity = "0";
  FX.swayT = 0; FX.blurT = 0; FX.blurRate = 2.5;
  els.real.hidden = false;
  document.body.classList.add("real");
  if (opts.fromRoom) await blackTo(0, 30);
  Sound.morning();
  await sleep(400);
  els.real.classList.add("focus");
  await lidsAnim([[0, 1], [0.32, 0.55], [0.44, 0.8], [0.7, 0.2], [0.8, 0.32], [1, 0]], 4400);
  await sleep(600);
  await say("You're back in the real world.", "real");
  await sleep(2200);
  if (opts.photo) {                            // but a photo lies beside you: that room, and him
    const k = els.keepsake;
    k.src = opts.photo.toDataURL("image/jpeg", 0.9);
    k.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => k.classList.add("in")));
    await sleep(2400);
    await say("…who took this?", "real");
    await sleep(2600);
    showEnd("good", "You're home. Aren't you?");
    return;
  }
  showEnd("good");
}

/* ============================================================
   STORY
   ============================================================ */
async function story() {
  await wake();
  await say("where …am I??", "q");
  await sleep(1100);
  let c = await choose([["look", "look around"], ["enter", "go in the building"]]);
  if (c === "enter") { await walkToDoor(); return atTheDoor(); }

  await lookAround();
  await choose([["walk", "walk around"]]);
  await walkAround();
  await giantReveal();
  await chaseRun();

  c = await choose([["run", "keep running"], ["tired", "so tired …"]]);
  if (c === "tired") return soTired();

  await finalStomp();
  return atTheDoor();
}

let started = false;
els.wake.addEventListener("click", () => {
  if (started) return;
  started = true;
  story().catch(e => console.error(e));
});

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  Loader.show(() => "Loading");
  loadSketchfabApi();          // fetched in the background; only the interior needs it
  const loaded = new Promise(res => els.vHouse.addEventListener("load", res, { once: true }));
  applyHouseSize();
  els.vHouse.src = CABLES_URL;
  await Promise.race([loaded, sleep(25000)]);
  await sleep(CABLES_SETTLE);
  showTitle();
})();

})();
